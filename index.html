<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OISNT PRO</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth">
    <div class="container">
        <h1>🔐 OISNT PRO</h1>
        <p>Indian & Pak OSINT Intelligence Suite</p>
        <button onclick="login()">🔓 Enter Dashboard</button>
    </div>

    <script>
        function login() {
            const uid = prompt("Enter Telegram UserID:");
            if (uid) {
                fetch(`/log?uid=${uid}&action=login`, { method: "GET" }).then(() => {
                    localStorage.setItem("user", uid);
                    window.location = "dashboard.html";
                });
            }
        }
    </script>
</body>
</html>
